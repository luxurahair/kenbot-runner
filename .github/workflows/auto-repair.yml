name: "Kenbot Safe Health Monitor"

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kenbot-safe-monitor
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SERVICE_URL: https://kenbot-dashboard-api.onrender.com
    steps:
      - name: Check public API health without changing production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["SERVICE_URL"].rstrip("/") + "/api/health"
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "kenbot-safe-monitor/2"})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      code = response.status
                  if code == 200:
                      print("HEALTHY: public health endpoint returned HTTP 200")
                      break
                  print(f"Attempt {attempt}: HTTP {code}")
              except (urllib.error.URLError, TimeoutError) as exc:
                  print(f"Attempt {attempt}: {type(exc).__name__}")
              if attempt < 3:
                  time.sleep(5)
          else:
              raise SystemExit("UNHEALTHY: alert via GitHub Actions failure. No automatic rollback, force push, or deploy triggered.")
          PY
