name: "Kenbot Manual Deploy Hook"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kenbot-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Require explicitly configured protected deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Missing VERCEL_DEPLOY_HOOK secret; no deployment attempted."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --retry 0 -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null
          echo "Deploy hook accepted."
